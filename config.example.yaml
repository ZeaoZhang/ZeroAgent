# ZeroAgent example configuration
#
# Copy this file to config.yaml, then replace API keys, API bases, and models.
# Do not commit real API keys.

# Backend selected on startup. Must match a key under llm_backends.
default_backend: claude

# Optional failover order. Each name must match a key under llm_backends.
# Example: [openai_compat]
failover_backends: []

# Agent runtime settings.
max_turns: 80
verbose: true
language: auto          # auto | zh | en
incremental_output: false
peer_hint: false

# Paths are resolved relative to config.yaml when they are not absolute.
workspace_dir: ./workspace
memory_dir: ./memory
sessions_dir: ./workspace/sessions
log_dir: null

# Extension system (plugins / skills / MCP).
# Plugins live in <home>/extensions/, skills in <home>/skills/,
# MCP servers in <home>/mcp.json. Default home is ~/.zeroagent.
extensions:
  enabled: true
  home: ~/.zeroagent
  # Extra paths that require human approval before the agent writes them.
  # Writes under ~/.zeroagent/{skills,extensions,mcp.json} are already protected:
  # the agent pauses and asks the user; approval is bound to the exact call, and
  # permission_gate adds a per-task, per-path scope so repeated edits to the same
  # file are not re-asked within 600 seconds. Writes inside workspace_dir are
  # never gated.
  protected_writes: []
  # Browser-control tools (web_*): auto | true | false.
  # auto registers them only when the optional [browser] runtime is importable;
  # true requires it; false disables the whole browser tool bundle.
  browser: auto
  # Process sandbox for code_run: off | auto | macos | linux.
  # "auto" uses sandbox-exec on macOS and bwrap on Linux, and warns plus
  # degrades when neither is available. An explicit "macos"/"linux" is a
  # contract: if that sandbox is unavailable the command is refused instead of
  # running unisolated. Set "off" to accept the risk explicitly.
  # Takes effect on config reload (registry rebuild); protected_writes is refreshed
  # on every reload; enabled/home need a restart.
  # 注意：YAML 1.1 会把未加引号的 off/on 解析成布尔，建议写成 "off"。
  sandbox: "auto"

# Optional local LiteLLM model price/context-window cache.
# litellm_model_cost_map: ./model_prices_and_context_window.json

bots:
  # Every channel needs at least one platform user ID in its allow list before
  # it will start; an empty list means "nobody", not "everybody". Set "*" to
  # explicitly publish a bot. The matching environment variable overrides the
  # list here (for example TG_ALLOWED_USERS=1001,1002).
  # Group chats (WeChat/Discord guild/QQ/DingTalk/WeCom) stay disabled unless
  # ZA_ALLOW_GROUP_CHATS=1 is set in the environment.
  tg_bot_token: "${TG_BOT_TOKEN}"
  tg_allowed_users: []
  discord_bot_token: "${DISCORD_BOT_TOKEN}"
  discord_allowed_users: []
  qq_app_id: "${QQ_APP_ID}"
  qq_app_secret: "${QQ_APP_SECRET}"
  qq_allowed_users: []
  fs_app_id: "${FS_APP_ID}"
  fs_app_secret: "${FS_APP_SECRET}"
  fs_allowed_users: []
  wecom_bot_id: "${WECOM_BOT_ID}"
  wecom_secret: "${WECOM_SECRET}"
  wecom_allowed_users: []
  dingtalk_client_id: "${DINGTALK_CLIENT_ID}"
  dingtalk_client_secret: "${DINGTALK_CLIENT_SECRET}"
  dingtalk_allowed_users: []
  # WeChat keeps its bot token in ~/.wxbot/token.json; only the allow list lives here.
  wechat_allowed_users: []

llm_backends:
  # Claude / Anthropic Messages API through LiteLLM.
  claude:
    provider: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    api_base: https://api.anthropic.com
    model: claude-sonnet-4-6

    # Generation options.
    context_window: 30000
    # Local history soft budget; null derives a conservative budget from the window.
    context_budget_tokens: null
    max_tokens: null
    temperature: 1.0
    stream: true

    # Retry, timeout, proxy, and TLS options.
    max_retries: 4
    connect_timeout: 5
    read_timeout: 120
    proxy: null
    verify: true

    # Custom request headers. Useful for relays, gateways, and vendor metadata.
    extra_headers: {}
    # extra_headers:
    #   X-Custom-Header: value
    #   X-Request-Source: ZeroAgent

    # Thinking and vision capabilities.
    thinking_type: null
    thinking_budget_tokens: null
    vision: false
    vision_model: null
    vision_max_tokens: 1024
    vision_detail: auto
    vision_max_pixels: 1440000

    # OpenAI service tier option for supported endpoints.
    service_tier: null

    # Failover health-check behavior.
    health_check_interval: 60
    spring_back_multiplier: 1.0

    # chat_completions is the default. responses is for OpenAI Responses API.
    api_mode: chat_completions

  # OpenAI official or OpenAI-compatible Chat Completions endpoint.
  # Uncomment this backend and set default_backend: openai_compat to use it.
  #
  # openai_compat:
  #   provider: openai
  #   api_key: sk-xxx
  #   api_base: https://api.openai.com/v1
  #   model: gpt-4o
  #   context_window: 128000
  #   context_budget_tokens: null
  #   max_tokens: null
  #   temperature: 1.0
  #   stream: true
  #   max_retries: 4
  #   connect_timeout: 5
  #   read_timeout: 120
  #   proxy: null
  #   verify: true
  #   thinking_type: null
  #   thinking_budget_tokens: null
  #   reasoning_effort: null
  #   vision: true
  #   vision_model: null
  #   vision_max_tokens: 1024
  #   vision_detail: auto
  #   vision_max_pixels: 1440000
  #   service_tier: null
  #   health_check_interval: 60
  #   spring_back_multiplier: 1.0
  #   api_mode: chat_completions
  #
  # Example OpenAI-compatible relays:
  #   api_base: https://api.deepseek.com/v1
  #   model: deepseek-chat
  #
  #   api_base: https://openrouter.ai/api/v1
  #   model: anthropic/claude-sonnet-4
  #   extra_headers:
  #     HTTP-Referer: https://example.com
  #     X-Title: ZeroAgent

  # OpenAI Responses API mode. Use only with endpoints that support Responses API.
  #
  # openai_responses:
  #   provider: openai
  #   api_key: sk-xxx
  #   api_base: https://api.openai.com/v1
  #   model: gpt-4.1
  #   stream: true
  #   api_mode: responses
  #   extra_headers: {}

  # Claude-compatible relay using Anthropic wire protocol.
  #
  # claude_compat:
  #   provider: anthropic
  #   api_key: sk-ant-or-relay-key
  #   api_base: https://your-claude-compatible-host
  #   model: claude-sonnet-4-6
  #   stream: true
  #   extra_headers:
  #     X-Custom-Header: value

# Optional Langfuse tracing. Replace placeholders locally; never commit secrets.
# langfuse:
#   public_key: pk-lf-REPLACE_ME
#   secret_key: sk-lf-REPLACE_ME
#   host: https://us.cloud.langfuse.com
