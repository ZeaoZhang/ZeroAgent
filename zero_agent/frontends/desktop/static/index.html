<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZeroAgent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Left Drawer: Session Management -->
    <aside id="left-drawer" class="drawer left-drawer">
      <div class="drawer-header">
        <h2>Sessions</h2>
        <div class="drawer-header-actions">
          <button id="add-group-btn" class="icon-btn" title="新建分组" aria-label="新建分组">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <path d="M12 11v4M10 13h4"/>
            </svg>
          </button>
          <button id="new-session-btn" class="icon-btn" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="drawer-content">
        <div id="session-list" class="session-list"></div>
      </div>
      <div class="drawer-footer" id="model-status" role="button" tabindex="0" title="Click to change model">
        <div class="model-info">
          <span id="current-model">Loading...</span>
        </div>
        <div class="token-info">
          <span id="token-usage">0 / 0</span>
        </div>
      </div>
      <button id="toggle-left-drawer" class="drawer-toggle left" title="Toggle sidebar (⌘B)" aria-label="Toggle left sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </aside>

    <!-- Main area -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <button id="toggle-left-drawer-alt" class="icon-btn" title="Toggle sessions" aria-label="Toggle sessions sidebar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12h18M3 6h18M3 18h18"/>
            </svg>
          </button>
          <h1 id="session-title">ZeroAgent</h1>
        </div>
        <div class="topbar-right">
          <span id="status-badge" class="badge">
            <span class="status-dot"></span>
            <span id="status-text">Starting…</span>
          </span>
          <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
            </svg>
          </button>
          <button id="channel-settings-btn" class="icon-btn" title="渠道设置" aria-label="打开渠道设置" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h16"/>
              <circle cx="8" cy="6" r="2" fill="var(--bg)" />
              <circle cx="16" cy="12" r="2" fill="var(--bg)" />
              <circle cx="10" cy="18" r="2" fill="var(--bg)" />
            </svg>
          </button>
          <button id="toggle-right-drawer-alt" class="icon-btn" title="Toggle agents" aria-label="Toggle agents sidebar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v6m0 6v6M5.6 5.6l4.2 4.2m4.4 4.4l4.2 4.2M1 12h6m6 0h6M5.6 18.4l4.2-4.2m4.4-4.4l4.2-4.2"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="search-bar" class="search-bar hidden">
        <input id="search-input" type="text" placeholder="Search messages…" aria-label="Search messages">
        <span id="search-count" class="search-count"></span>
        <button id="search-prev" class="search-nav-btn" title="Previous (Shift+Enter)" aria-label="Previous match">▲</button>
        <button id="search-next" class="search-nav-btn" title="Next (Enter)" aria-label="Next match">▼</button>
        <button id="search-close" class="search-nav-btn" title="Close (Escape)" aria-label="Close search">✕</button>
      </div>

      <section id="messages" class="empty">
        <div class="empty-state">
          <div class="empty-title">New task</div>
          <div class="empty-sub">Task me anything. Type <code>/help</code> for commands.</div>
        </div>
      </section>

      <div id="composer-wrap">
        <div id="command-palette" class="command-palette hidden" role="listbox" aria-label="Command suggestions"></div>
        <div id="composer">
          <div id="image-previews" class="image-previews"></div>
          <textarea id="input" rows="1" placeholder="Type a message, or /help"></textarea>
          <div class="composer-bottom">
            <input id="file-input" type="file" multiple hidden aria-label="Choose files">
            <button id="attach-btn" class="attach-btn" type="button" title="Attach files" aria-label="Attach files">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>
              </svg>
            </button>
            <button id="send-btn" class="send-btn" type="button" title="Send (Enter)">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Drawer: Agent Control Panel -->
    <aside id="right-drawer" class="drawer right-drawer collapsed">
      <div class="drawer-header">
        <h2>Active Agents</h2>
        <button id="close-right-drawer" class="icon-btn" title="Close" aria-label="Close agents panel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="drawer-content">
        <div id="agent-list" class="agent-list">
          <div class="empty-state-small">
            <span>No active agents</span>
          </div>
        </div>
      </div>
      <button id="toggle-right-drawer" class="drawer-toggle right" title="Toggle agents (⌘⌥B)" aria-label="Toggle right sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </aside>

    <!-- Model Picker Modal -->
    <div id="model-picker-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3>Select Model</h3>
          <button class="icon-btn" id="close-model-picker">✕</button>
        </div>
        <div class="modal-body">
          <div id="model-list" class="model-list"></div>
        </div>
      </div>
    </div>

    <!-- Channel Settings Modal -->
    <div id="channel-settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="channel-settings-title">
      <div class="modal-backdrop" data-close-channel-settings></div>
      <div class="modal-content channel-settings-dialog">
        <div class="modal-header">
          <div>
            <h3 id="channel-settings-title">渠道设置</h3>
            <p class="modal-subtitle">运行控制渠道进程；连接 App 控制是否处理新消息。</p>
          </div>
          <div class="modal-header-actions">
            <button class="icon-btn" id="refresh-channel-settings" title="刷新渠道状态" aria-label="刷新渠道状态">↻</button>
            <button class="icon-btn" id="close-channel-settings" title="关闭" aria-label="关闭渠道设置">✕</button>
          </div>
        </div>
        <div class="modal-body">
          <div id="channel-list" class="channel-list">
            <div class="empty-state-small"><span>正在加载渠道状态…</span></div>
          </div>
        </div>
        <div class="modal-footer">
          <span class="channel-settings-hint">未配置渠道不会启动，密钥不会显示在此处。</span>
          <button class="btn" id="channel-settings-done">完成</button>
        </div>
      </div>
    </div>

    <!-- Channel Configuration Modal -->
    <div id="channel-config-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="channel-config-title">
      <div class="modal-backdrop" data-close-channel-config></div>
      <div class="modal-content channel-config-dialog">
        <div class="modal-header">
          <h3 id="channel-config-title">渠道配置</h3>
          <button class="icon-btn" id="close-channel-config" title="关闭" aria-label="关闭渠道配置">✕</button>
        </div>
        <div class="modal-body">
          <div id="channel-config-error" class="msg-error" role="alert" aria-live="polite"></div>
          <div id="channel-config-form" class="channel-config-form"></div>
          <div id="wechat-qr-panel" class="wechat-qr-panel hidden">
            <p id="wechat-qr-status" class="channel-config-source">点击扫码登录生成二维码。</p>
            <img id="wechat-qr-image" class="wechat-qr-image" alt="微信登录二维码" />
            <button type="button" class="btn primary" id="wechat-qr-start">扫码登录</button>
          </div>
        </div>
        <div class="modal-footer channel-config-actions">
          <button type="button" class="btn ghost" id="channel-config-cancel">取消</button>
          <button type="button" class="btn primary" id="channel-config-save">保存</button>
        </div>
      </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-backdrop" data-close-confirm></div>
      <div class="modal-content confirm-dialog">
        <div class="modal-header">
          <h3 id="confirm-title">确认</h3>
          <button class="icon-btn" id="confirm-close" aria-label="取消">✕</button>
        </div>
        <div class="modal-body">
          <p id="confirm-message" class="dialog-message"></p>
        </div>
        <div class="modal-footer">
          <button class="btn ghost" id="confirm-cancel">取消</button>
          <button class="btn primary" id="confirm-ok">确认</button>
        </div>
      </div>
    </div>

    <!-- Prompt Dialog -->
    <div id="prompt-modal" class="modal hidden">
      <div class="modal-backdrop" data-close-prompt></div>
      <div class="modal-content prompt-dialog">
        <div class="modal-header">
          <h3 id="prompt-title">输入</h3>
          <button class="icon-btn" id="prompt-close" aria-label="取消">✕</button>
        </div>
        <div class="modal-body">
          <input id="prompt-input" class="dialog-input" type="text" autocomplete="off" />
        </div>
        <div class="modal-footer">
          <button class="btn ghost" id="prompt-cancel">取消</button>
          <button class="btn primary" id="prompt-ok">确定</button>
        </div>
      </div>
    </div>

    <!-- Session menu (move to group) -->
    <div id="session-menu" class="session-menu hidden" role="menu" aria-label="移动到分组">
      <div class="session-menu-title">移动到分组</div>
      <div id="session-menu-groups" class="session-menu-groups"></div>
      <button type="button" class="session-menu-item" data-menu-action="new-group" role="menuitem">＋ 新建分组…</button>
      <button type="button" class="session-menu-item" data-menu-action="ungroup" role="menuitem">移出分组</button>
    </div>

    <!-- Error banner -->
    <div id="error-banner" class="error-banner hidden">
      <span id="error-text"></span>
      <button class="icon-btn ghost" id="error-action"></button>
      <button class="icon-btn ghost" id="error-dismiss">✕</button>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="za-web.js?v=za-sidebar-2"></script>
  <script src="app.js?v=za-sidebar-2"></script>
</body>
</html>
